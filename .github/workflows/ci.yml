name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Les hooks git ne servent qu'en local.
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'

jobs:
  check:
    name: Biome, typecheck, knip, tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Tests e2e Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Deuxième site : La Réunification des deux Corées (dossier reunification/).
  reunification-check:
    name: Deux Corées · Biome, typecheck, knip, tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reunification
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: reunification/.nvmrc
          cache: npm
          cache-dependency-path: reunification/package-lock.json
      - run: npm ci
      - run: npm run check

  reunification-e2e:
    name: Deux Corées · Tests e2e Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reunification
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: reunification/.nvmrc
          cache: npm
          cache-dependency-path: reunification/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-reunification
          path: reunification/playwright-report/
          retention-days: 14

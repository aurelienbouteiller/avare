<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140B0F">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Le souffleur d'Harpagon</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script>
// Applique le thème enregistré avant le premier affichage, pour éviter un flash.
try{ const t=JSON.parse(localStorage.getItem('souffleur-harpagon-v1'))?.s?.theme;
  if(t==='clair') document.documentElement.dataset.theme='light'; else if(t==='auto') delete document.documentElement.dataset.theme; }catch{}
</script>
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<sf-top></sf-top>
<sf-script></sf-script>
<sf-dock></sf-dock>
<sf-tabs></sf-tabs>
<sf-settings></sf-settings>
</body>
</html>
